services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - osrs-market-data:/app/data
    restart: unless-stopped

  fusionauth:
    image: fusionauth/fusionauth-app:${FUSIONAUTH_VERSION:-1.69.0}
    ports:
      - target: 9011
        published: "${FUSIONAUTH_PORT:-9011}"
        host_ip: "127.0.0.1"
        protocol: tcp
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${FUSIONAUTH_DATABASE_NAME}
      DATABASE_ROOT_USERNAME: ${POSTGRES_USER}
      DATABASE_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USERNAME: ${FUSIONAUTH_DATABASE_USER}
      DATABASE_PASSWORD: ${FUSIONAUTH_DATABASE_PASSWORD}
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.prod.json
      FUSIONAUTH_APP_MEMORY: ${FUSIONAUTH_APP_MEMORY:-512M}
      FUSIONAUTH_APP_RUNTIME_MODE: production
      FUSIONAUTH_APP_SILENT_MODE: "true"
      FUSIONAUTH_APP_URL: http://fusionauth:9011
      SEARCH_TYPE: database
    volumes:
      - fusionauth-config:/usr/local/fusionauth/config
      - ./.secrets/kickstart.prod.json:/usr/local/fusionauth/kickstart/kickstart.prod.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9011/api/status >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file:
      - .secrets/production.env
    environment:
      TRUST_PROXY: "true"
      PORT: 3000

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      FUSIONAUTH_INTERNAL_URL: http://fusionauth:9011
      FUSIONAUTH_PUBLIC_URL: ${FUSIONAUTH_PUBLIC_URL}

      FUSIONAUTH_APPLICATION_ID: ${FUSIONAUTH_APPLICATION_ID}
      FUSIONAUTH_CLIENT_SECRET: ${FUSIONAUTH_CLIENT_SECRET}

      OAUTH_REDIRECT_URI: ${FUSIONAUTH_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}

      TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY}

      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: osrs_market_session
      SESSION_TTL_SECONDS: 2592000
      OAUTH_ATTEMPT_TTL_SECONDS: 600
    depends_on:
      fusionauth:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/auth/health || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fusionauth-config:
  osrs-market-data:
  auth-node-modules:
  postgres-data: