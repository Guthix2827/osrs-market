services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app
      - backend-build:/app/build
      - osrs-market-data:/app/data
    command: >
      sh -c "
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug &&
        cmake --build build &&
        ./build/osrs-market-backend
      "
    environment:
      DATABASE_URL: postgres://osrs_market:osrs_market@postgres:5432/osrs_market

  fusionauth:
    image: fusionauth/fusionauth-app:1.69.0
    ports:
      - "127.0.0.1:9011:9011"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/fusionauth
      DATABASE_ROOT_USERNAME: osrs_market
      DATABASE_ROOT_PASSWORD: osrs_market
      DATABASE_USERNAME: fusionauth
      DATABASE_PASSWORD: fusionauth
      FUSIONAUTH_APP_KICKSTART_FILE: /usr/local/fusionauth/kickstart/kickstart.dev.json
      FUSIONAUTH_APP_MEMORY: 512M
      FUSIONAUTH_APP_RUNTIME_MODE: development
      FUSIONAUTH_APP_SILENT_MODE: "true"
      FUSIONAUTH_APP_URL: http://fusionauth:9011
      SEARCH_TYPE: database
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - fusionauth-config:/usr/local/fusionauth/config
      - ./auth/kickstart:/usr/local/fusionauth/kickstart:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9011/api/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  auth:
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./auth-service:/app
      - auth-node-modules:/app/node_modules
    env_file:
      - ./.secrets/auth-service.env
    environment:
      PORT: 3000

      DATABASE_URL: postgres://osrs_market:osrs_market@postgres:5432/osrs_market

      FUSIONAUTH_INTERNAL_URL: http://fusionauth:9011
      FUSIONAUTH_PUBLIC_URL: http://localhost:9011

      OAUTH_REDIRECT_URI: http://localhost:5173/auth/callback
      FRONTEND_URL: http://localhost:5173

      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: osrs_market_session
      SESSION_TTL_SECONDS: 2592000
      OAUTH_ATTEMPT_TTL_SECONDS: 600
    depends_on:
      fusionauth:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/auth/health || exit 1"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: osrs_market
      POSTGRES_USER: osrs_market
      POSTGRES_PASSWORD: osrs_market
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osrs_market -d osrs_market" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend-build:
  fusionauth-config:
  osrs-market-data:
  auth-node-modules:
  postgres-data: