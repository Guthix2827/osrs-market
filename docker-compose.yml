services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/app
      - backend-build:/app/build
      - osrs-market-data:/app/data
    command: >
      sh -c "
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug &&
        cmake --build build &&
        ./build/osrs-market-backend
      "
    environment:
      DATABASE_URL: postgres://osrs_market:osrs_market@postgres:5432/osrs_market

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: osrs_market
      POSTGRES_USER: osrs_market
      POSTGRES_PASSWORD: osrs_market
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/sql:/sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U osrs_market -d osrs_market" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  backend-build:
  osrs-market-data:
  postgres-data: