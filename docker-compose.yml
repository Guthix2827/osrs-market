services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    ports:
      - "8081:8080"
    volumes:
      - osrs-market-data:/app/data

volumes:
  osrs-market-data: