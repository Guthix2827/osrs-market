server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # GET /api/items/search?q=...
    location = /api/items/search {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/items/<id>
    location ~ ^/api/items/[0-9]+$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/items/<id>/history?range=...
    location ~ ^/api/items/[0-9]+/history$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /icons/<id>.png
    location ~ ^/icons/[0-9]+\.png$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reject every other backend/API path.
    location /api/ {
        return 404;
    }

    location /icons/ {
        return 404;
    }

    # React SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}