proxy_cache_path /var/cache/nginx/osrs_market
    levels=1:2
    keys_zone=osrs_market_cache:10m
    max_size=100m
    inactive=24h
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # GET /api/items/search?q=...
    location = /api/items/search {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/items/<id>
    location ~ ^/api/items/[0-9]+$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/items/<id>/history?range=...
    location ~ ^/api/items/[0-9]+/history$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/items/<id>/watch-summary
    location ~ ^/api/items/[0-9]+/watch-summary$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /icons/<id>.png
    location ~ ^/icons/[0-9]+\.png$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/market/movers {
        limit_except GET {
            deny all;
        }
        proxy_cache osrs_market_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri";

        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://backend:8080;
    }

    #Auth
    location ~ ^/auth/(login|callback|session|logout)$ {
        proxy_pass http://auth:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto
            $scheme;

        proxy_set_header X-Forwarded-Host
            $host;

        proxy_set_header X-Forwarded-Port
            $server_port;
    }

    # Reject every other backend/API path.
    location /api/ {
        return 404;
    }

    location /icons/ {
        return 404;
    }

    # React SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}